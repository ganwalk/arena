<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Plataforma Arena: vídeo</title>
    <!--
      Vídeo de apresentação da Plataforma Arena, animado quadro a quadro.
      Tudo é função do tempo: render(t) desenha o quadro do segundo t, sem transições de CSS.
      Formato pela busca: ?f=169 (1920 x 1080) ou ?f=916 (1080 x 1920).
      Gravação: npm run video (scripts/video.mjs). Para ver no navegador, abra com ?tocar.
    -->
    <style>
      @font-face {
        font-family: "Schibsted";
        font-weight: 400 900;
        src: url("../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Schibsted";
        font-weight: 400 900;
        src: url("../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-ext-wght-normal.woff2") format("woff2");
        unicode-range: U+0100-024F, U+1E00-1EFF;
      }
      :root {
        --noite: #0e1416;
        --grafite: #1c2529;
        --grafite-2: #243035;
        --petroleo: #209ba0;
        --acao: #0b7377;
        --acao-claro: #5fc9cd;
        --nevoa: #eef3f3;
        --gelo: #d9e3e4;
        --tinta: #1f2a2f;
        --tinta-2: #56656c;
        --linha: #e0e6e8;
        --sup-2: #f0f3f4;
        --ok: #1f7a4d;
        --perigo: #b3261e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #000; overflow: hidden; }
      body { font-family: "Schibsted", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }

      #palco { position: relative; overflow: hidden; background: var(--noite); }
      .f169 { width: 1920px; height: 1080px; }
      .f916 { width: 1080px; height: 1920px; }

      .fundo { position: absolute; inset: 0; background: radial-gradient(1200px 900px at 85% 10%, rgb(32 155 160 / 0.14), transparent 60%), radial-gradient(900px 900px at 0% 100%, rgb(32 155 160 / 0.08), transparent 60%); }
      .fundo svg { position: absolute; width: 420px; height: 420px; opacity: 0.05; }

      .cena { position: absolute; inset: 0; opacity: 0; }

      /* legenda: olho e título */
      .legenda { position: absolute; }
      .f169 .legenda { left: 130px; top: 50%; width: 680px; transform: translateY(-50%); }
      .f916 .legenda { left: 80px; top: 200px; width: 920px; }
      .olho { font-size: 26px; font-weight: 700; letter-spacing: 0.02em; color: var(--acao-claro); margin-bottom: 22px; display: flex; align-items: center; gap: 14px; }
      .f916 .olho { font-size: 34px; }
      .olho::before { content: ""; width: 44px; height: 4px; background: var(--acao-claro); border-radius: 2px; }
      .titulo { font-size: 66px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; }
      .f916 .titulo { font-size: 76px; }
      .titulo .m { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; margin-bottom: -0.08em; }
      .titulo .m > span { display: inline-block; }

      /* caixa de 900 x 800 onde a interface acontece; o formato só muda a escala */
      .caixa { position: absolute; width: 900px; height: 800px; transform-origin: 0 0; }
      .f169 .caixa { left: 900px; top: 140px; }
      .f916 .caixa { left: 40px; top: 680px; scale: 1.111; }

      .abs { position: absolute; }

      /* janela da plataforma */
      .jan { position: absolute; background: #f5f7f7; color: var(--tinta); border-radius: 22px; overflow: hidden; box-shadow: 0 40px 90px rgb(0 0 0 / 0.45), 0 0 0 1px rgb(255 255 255 / 0.06); }
      .jan-barra { height: 64px; background: var(--grafite); color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 22px; font-size: 21px; }
      .jan-barra .simb { width: 30px; height: 30px; }
      .jan-barra .marca b { font-weight: 800; }
      .jan-portal { margin-left: 18px; background: #fff; color: var(--tinta); border-radius: 999px; padding: 7px 18px; font-weight: 700; font-size: 19px; }
      .jan-pessoa { margin-left: auto; display: flex; align-items: center; gap: 12px; }
      .jan-pessoa img { width: 40px; height: 40px; border-radius: 50%; }
      .jan-pessoa span { display: flex; flex-direction: column; line-height: 1.15; font-size: 18px; }
      .jan-pessoa small { color: #b9c6c9; font-size: 15px; }
      .jan-corpo { padding: 26px 28px; }
      .jan-h { font-size: 36px; font-weight: 800; letter-spacing: -0.01em; }
      .jan-sub { font-size: 20px; color: var(--tinta-2); margin-top: 4px; }

      .jan.escura { background: #101618; color: #e6ebec; }
      .jan.escura .jan-barra { background: #0b1012; }
      .jan.escura .jan-sub { color: #9fadb2; }

      /* celular */
      .cel { position: absolute; width: 380px; height: 780px; border-radius: 54px; background: #0b1012; padding: 12px; box-shadow: 0 40px 90px rgb(0 0 0 / 0.5), 0 0 0 2px #2a353a; }
      .cel-tela { position: relative; width: 100%; height: 100%; border-radius: 43px; overflow: hidden; background: #f5f7f7; color: var(--tinta); }
      .cel-barra { height: 92px; padding: 36px 22px 0; background: var(--grafite); display: flex; align-items: center; justify-content: space-between; }
      .cel-barra .simb { width: 34px; height: 34px; }
      .cel-barra .av { width: 40px; height: 40px; border-radius: 50%; }
      .cel-corpo { position: absolute; left: 0; right: 0; top: 92px; padding: 22px; }
      .cel-h { font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em; }
      .cel-sub { font-size: 18px; color: var(--tinta-2); margin-top: 8px; line-height: 1.3; }


      /* peças comuns */
      .cartao { background: #fff; border: 1px solid var(--linha); border-radius: 16px; padding: 18px 20px; color: var(--tinta); box-shadow: 0 2px 0 rgb(28 37 41 / 0.04); }
      .cartao b { font-weight: 800; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 58px; padding: 0 26px; border-radius: 12px; background: var(--acao); color: #fff; font-weight: 700; font-size: 22px; white-space: nowrap; }
      .btn.sec { background: #fff; color: var(--tinta); border: 2px solid var(--linha); }
      .btn.ok { background: var(--ok); }
      .selo { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--linha); border-radius: 999px; padding: 4px 14px; font-size: 17px; font-weight: 600; background: #fff; color: var(--tinta); white-space: nowrap; }
      .selo i { width: 9px; height: 9px; border-radius: 50%; background: var(--acao); display: inline-block; }
      .campo { margin-top: 16px; }
      .campo label { display: block; font-size: 17px; font-weight: 600; color: var(--tinta-2); margin-bottom: 6px; }
      .campo .valor { height: 54px; border: 2px solid #c3ced1; border-radius: 10px; background: #fff; display: flex; align-items: center; padding: 0 16px; font-size: 21px; gap: 2px; }
      .cursor-texto { width: 2px; height: 26px; background: var(--acao); display: inline-block; }
      .av { border-radius: 50%; object-fit: cover; }
      .ic { width: 1em; height: 1em; flex: none; }

      /* toque */
      .toque { position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; z-index: 50; opacity: 0; pointer-events: none; }
      .toque .p { position: absolute; inset: 0; border-radius: 50%; background: rgb(11 115 119 / 0.28); border: 3px solid #0b7377; box-shadow: 0 0 0 3px rgb(255 255 255 / 0.85), 0 8px 20px rgb(0 0 0 / 0.25); }
      .toque .o { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #0b7377; opacity: 0; }

      /* aviso que desce */
      .aviso { position: absolute; display: flex; gap: 16px; align-items: center; background: #fff; color: var(--tinta); border-radius: 18px; padding: 16px 20px; box-shadow: 0 24px 50px rgb(0 0 0 / 0.35); font-size: 19px; line-height: 1.3; }
      .aviso b { display: block; font-size: 21px; font-weight: 800; }
      .aviso img { width: 52px; height: 52px; }
      .aviso .marcador { width: 52px; height: 52px; border-radius: 50%; background: var(--acao); color: #fff; display: grid; place-items: center; font-size: 28px; flex: none; }

      /* trilho das sete etapas */
      .trilho { position: absolute; display: flex; gap: 14px; opacity: 0; }
      .f169 .trilho { left: 50%; bottom: 44px; translate: -50% 0; }
      .f916 .trilho { left: 50%; bottom: 72px; translate: -50% 0; gap: 18px; }
      .trilho span { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 19px; border: 2px solid #3a474d; color: #93a2a7; }
      .f916 .trilho span { width: 52px; height: 52px; font-size: 24px; }
      .trilho span.feito { background: #243035; border-color: #243035; color: #c9d4d6; }
      .trilho span.agora { background: var(--acao-claro); border-color: var(--acao-claro); color: #072022; }

      /* cortina de módulos */
      .cortina { position: absolute; inset: 0; pointer-events: none; z-index: 80; }
      .cortina svg, .grade svg { position: absolute; display: block; }

      /* abertura e fecho */
      .grade { position: absolute; inset: 0; }
      .assinatura { position: absolute; left: 0; right: 0; top: 50%; translate: 0 -50%; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .assinatura .simb { width: 150px; height: 150px; }
      .assinatura .nome { font-size: 112px; font-weight: 800; letter-spacing: -0.03em; margin-top: 34px; line-height: 1; }
      .assinatura .nome b { font-weight: 800; color: var(--acao-claro); }
      .f916 .assinatura .nome { font-size: 104px; }
      .assinatura .onde { font-size: 38px; color: #b9c6c9; margin-top: 26px; font-weight: 500; }
      .ressalva { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; font-size: 22px; color: #6f7f85; }
      .f916 .ressalva { bottom: 90px; font-size: 28px; }

      /* fluxo */
      .fluxo-legenda { position: absolute; text-align: center; left: 50%; translate: -50% 0; }
      .f169 .fluxo-legenda { top: 170px; width: 1500px; }
      .f916 .fluxo-legenda { top: 200px; width: 940px; text-align: left; left: 80px; translate: 0 0; }
      .f169 .fluxo-legenda .olho { justify-content: center; }
      .fluxo-legenda .titulo { font-size: 76px; }
      .f916 .fluxo-legenda .titulo { font-size: 76px; }
      .no { position: absolute; width: 0; height: 0; }
      .no .c { position: absolute; width: 104px; height: 104px; left: -52px; top: -52px; border-radius: 50%; background: var(--grafite-2); border: 4px solid var(--acao-claro); display: grid; place-items: center; font-size: 44px; font-weight: 800; color: #fff; }
      .no .r { position: absolute; font-size: 32px; font-weight: 700; white-space: nowrap; color: #e6ebec; }
      .f169 .no .r { top: 72px; left: 0; translate: -50% 0; }
      .f916 .no .r { left: 84px; top: -22px; font-size: 40px; }
      .no img { position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 3px solid var(--noite); }
      .f169 .no img { left: 22px; top: -86px; }
      .f916 .no img { left: 22px; top: -86px; }
      .volta { position: absolute; font-size: 30px; font-weight: 700; color: var(--acao-claro); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="palco"></div>

    <script>
      /* ---------- formato ---------- */
      const busca = new URLSearchParams(location.search);
      const FORMATO = busca.get("f") === "916" ? "916" : "169";
      const L = FORMATO === "169" ? 1920 : 1080;
      const A = FORMATO === "169" ? 1080 : 1920;
      const palco = document.getElementById("palco");
      palco.className = "f" + FORMATO;

      /* ---------- tempo e curvas ---------- */
      const cl = (x) => Math.max(0, Math.min(1, x));
      const pr = (t, a, b) => cl((t - a) / (b - a));
      const lerp = (a, b, x) => a + (b - a) * x;
      const eo = (x) => 1 - Math.pow(1 - x, 3);
      const ei = (x) => x * x * x;
      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const ex = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
      const eb = (x) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
      const k = (t, a, b, e = eo) => e(pr(t, a, b));

      function pos(el, { x = 0, y = 0, s = 1, r = 0, o } = {}) {
        el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(4)}) rotate(${r.toFixed(2)}deg)`;
        if (o !== undefined) el.style.opacity = cl(o).toFixed(3);
      }
      const $ = (sel, raiz = document) => raiz.querySelector(sel);
      const $$ = (sel, raiz = document) => [...raiz.querySelectorAll(sel)];

      /* ---------- recursos ---------- */
      const RAIZ = "../public";
      const SIMB = `${RAIZ}/brand/simbolo.svg`;
      const foto = (n) => `${RAIZ}/plataforma/pessoas/${n}.jpg`;
      const simb = (cls = "") => `<img class="simb ${cls}" src="simbolo-branco.svg" alt="" />`;

      const ICONES = {
        ok: '<path d="M5 12l5 5L20 7"/>',
        relogio: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
        envio: '<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',
        arquivo: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
        sino: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
        balao: '<path d="M4 5h16v11H9l-5 4z"/>',
        pessoas: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
        lista: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
        seta: '<path d="M5 12h14M13 6l6 6-6 6"/>',
        cadeado: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
        funil: '<path d="M3 4h18l-7 9v6l-4 2v-8z"/>',
      };
      const ic = (n, est = "") => `<svg class="ic" style="${est}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[n]}</svg>`;

      /* módulos do painel da marca, 100 x 100 */
      const FORMAS = {
        quarto: (c) => `<path d="M0 100V0a100 100 0 0 1 100 100Z" fill="${c}"/>`,
        triangulo: (c) => `<path d="M0 0h100L0 100Z" fill="${c}"/>`,
        folha: (c) => `<path d="M0 0h50a50 50 0 0 1 50 50v50H0Z" fill="${c}"/>`,
        ponto: (c) => `<circle cx="50" cy="50" r="24" fill="${c}"/>`,
        anel: (c, f) => `<circle cx="50" cy="50" r="34" fill="${c}"/><circle cx="50" cy="50" r="17" fill="${f}"/>`,
        listras: (c) => [-80, -50, -20, 10, 40, 70, 100, 130, 160].map((o) => `<line x1="${o}" y1="100" x2="${o + 100}" y2="0" stroke="${c}" stroke-width="9"/>`).join(""),
      };
      const NOMES_FORMAS = Object.keys(FORMAS);
      let semente = 7;
      const sorte = () => ((semente = (semente * 16807) % 2147483647) / 2147483647);
      const modulo = (forma, cor, fundo, giro) =>
        `<svg viewBox="0 0 100 100" overflow="hidden"><rect width="100" height="100" fill="${fundo}"/><g transform="rotate(${giro} 50 50)">${FORMAS[forma](cor, fundo)}</g></svg>`;

      /* legenda com palavras que sobem uma a uma */
      const legenda = (olho, titulo, cls = "legenda") =>
        `<div class="${cls}"><p class="olho">${olho}</p><h2 class="titulo">${titulo
          .split(" ")
          .map((p) => `<span class="m"><span>${p}</span></span>`)
          .join(" ")}</h2></div>`;

      function animarLegenda(raiz, lt, dur, inicio = 0.25) {
        const olho = $(".olho", raiz);
        pos(olho, { x: lerp(-30, 0, k(lt, inicio, inicio + 0.5)), o: k(lt, inicio, inicio + 0.4) });
        $$(".m > span", raiz).forEach((s, i) => {
          const a = inicio + 0.15 + i * 0.045;
          pos(s, { y: lerp(110, 0, k(lt, a, a + 0.55, ex)) });
        });
        const saida = k(lt, dur - 0.45, dur - 0.1, ei);
        const leg = raiz.querySelector(".legenda, .fluxo-legenda");
        leg.style.opacity = 1 - saida;
      }

      /* toque na tela: chaves [t, x, y] e cliques em t */
      function toque(el, lt, chaves, cliques = []) {
        if (lt < chaves[0][0] - 0.3 || lt > chaves[chaves.length - 1][0] + 0.6) { el.style.opacity = 0; return; }
        let x = chaves[0][1], y = chaves[0][2];
        for (let i = 1; i < chaves.length; i++) {
          const [t0, x0, y0] = chaves[i - 1], [t1, x1, y1] = chaves[i];
          if (lt >= t0) { const e = eio(pr(lt, t0, t1)); x = lerp(x0, x1, e); y = lerp(y0, y1, e); }
        }
        let s = 1, onda = 0, ondaO = 0;
        for (const c of cliques) {
          const d = lt - c;
          if (d > -0.12 && d < 0.3) s = Math.min(s, d < 0 ? lerp(1, 0.78, (d + 0.12) / 0.12) : lerp(0.78, 1, eo(d / 0.3)));
          if (d >= 0 && d < 0.5) { onda = lerp(1, 2.4, eo(d / 0.5)); ondaO = 1 - d / 0.5; }
        }
        const o = Math.min(k(lt, chaves[0][0] - 0.3, chaves[0][0]), 1 - k(lt, chaves[chaves.length - 1][0] + 0.2, chaves[chaves.length - 1][0] + 0.6));
        el.style.opacity = o;
        el.style.transform = `translate(${x}px, ${y}px)`;
        $(".p", el).style.transform = `scale(${s})`;
        const anel = $(".o", el);
        anel.style.transform = `scale(${onda})`;
        anel.style.opacity = ondaO;
      }
      const TOQUE = `<div class="toque"><div class="o"></div><div class="p"></div></div>`;

      const digitar = (el, texto, lt, a, b, cursor = true) => {
        const n = Math.round(texto.length * pr(lt, a, b));
        const piscando = cursor && lt > a - 0.4 && (lt < b + 0.2 || false);
        el.innerHTML = texto.slice(0, n) + (piscando ? '<span class="cursor-texto"></span>' : "");
      };

      /* ---------- roteiro ---------- */
      const CENAS = [
        { id: "abertura", dur: 4.6 },
        { id: "login", dur: 6.2 },
        { id: "captacao", dur: 6.8, etapa: 2 },
        { id: "matricula", dur: 6.4, etapa: 3 },
        { id: "familia", dur: 6.8, etapa: 4 },
        { id: "entrega", dur: 6.6, etapa: 5 },
        { id: "plantao", dur: 6.2, etapa: 5 },
        { id: "professor", dur: 6.4, etapa: 6 },
        { id: "gestao", dur: 6.2, etapa: 7 },
        { id: "fluxo", dur: 6.6 },
        { id: "fim", dur: 5.0 },
      ];
      let acc = 0;
      for (const c of CENAS) { c.ini = acc; acc += c.dur; c.fim = acc; }
      const DURACAO = acc;
      /* cortinas de módulos nas viradas de capítulo */
      const CORTINAS = [CENAS[1].ini, CENAS[9].ini, CENAS[10].ini];

      /* ---------- montagem ---------- */
      const html = [];
      html.push(`<div class="fundo">${[0, 1, 2]
        .map((i) => `<svg viewBox="0 0 100 100" data-fundo="${i}">${FORMAS[["quarto", "anel", "listras"][i]]("#5fc9cd", "#0e1416")}</svg>`)
        .join("")}</div>`);

      /* abertura */
      html.push(`<section class="cena" id="abertura"><div class="grade"></div>
        <div class="assinatura">${simb()}<p class="nome"><span class="w">Plataforma</span> <b class="w">Arena</b></p><p class="onde">Colégio Arena · Goiânia</p></div></section>`);

      /* 1. um login */
      const apps = [
        ["HD Virtual", "H", 20, 60],
        ["EduConnect", "E", 590, 30],
        ["Plantões Arena", "P", 0, 560],
        ["WhatsApp", "W", 610, 600],
      ];
      html.push(`<section class="cena" id="login">${legenda("Um acesso", "Um login para aluno, família, professor e gestão.")}
        <div class="caixa">
          ${apps
            .map(([n, l, x, y]) => `<div class="abs app" style="left:${x}px;top:${y}px;width:290px;height:92px;border-radius:18px;background:#1e272b;border:1.5px solid #3a474d;display:flex;align-items:center;gap:16px;padding:0 20px;color:#c9d4d6;font-size:26px;font-weight:600"><span style="width:50px;height:50px;border-radius:12px;background:#29343a;display:grid;place-items:center;font-weight:800;color:#93a2a7">${l}</span>${n}</div>`)
            .join("")}
          <div class="abs entrar cartao" style="left:220px;top:110px;width:460px;padding:40px 40px 36px;border-radius:26px;box-shadow:0 40px 90px rgb(0 0 0 / .5)">
            <img src="${SIMB}" style="width:62px;height:62px" alt="" />
            <p style="font-size:38px;font-weight:800;margin-top:16px;letter-spacing:-.01em">Plataforma Arena</p>

      /* grades de módulos (abertura e cortina) */

      const CORES = ["#0b7377", "#209ba0", "#5fc9cd", "#d9e3e4", "#3b4a52"];
      const FUNDOS = ["#1c2529", "#1c2529", "#243035", "#0b7377"];
      function grade(raiz, cheia) {
        const cel = [];
        for (let lin = 0; lin < LINS; lin++)
          for (let col = 0; col < COLS; col++) {
            const forma = NOMES_FORMAS[Math.floor(sorte() * NOMES_FORMAS.length)];
            const cor = CORES[Math.floor(sorte() * CORES.length)];
            let fundo = cheia ? FUNDOS[Math.floor(sorte() * FUNDOS.length)] : "transparent";
            if (fundo === cor) fundo = "#1c2529";
            const giro = [0, 90, 180, 270][Math.floor(sorte() * 4)];
            const div = document.createElement("div");
            div.innerHTML = modulo(forma, cor, fundo === "transparent" ? "#0e1416" : fundo, giro);
            const svg = div.firstChild;
            Object.assign(svg.style, { left: col * CEL + "px", top: lin * CEL + "px", width: CEL + 1 + "px", height: CEL + 1 + "px" });
            raiz.appendChild(svg);
            const cx = (col + 0.5) / COLS - 0.5, cy = (lin + 0.5) / LINS - 0.5;
            cel.push({ svg, d: Math.hypot(cx * (L / A), cy), diag: (col / COLS + lin / LINS) / 2, sorte: sorte() });
          }
        return cel;
      }

        return [x + el.offsetWidth / 2, y + el.offsetHeight / 2];

          });
          $$(".cp", r).forEach((c, i) => {
            pos(c, { y: lerp(80, 0, k(lt, 0.6 + i * 0.1, 1.3 + i * 0.1, ex)), o: k(lt, 0.6 + i * 0.1, 1.0 + i * 0.1) });
            const a = 3.65 + i * 0.12;
            pos($(".np", c), { y: lerp(-40, 0, k(lt, a, a + 0.45, eb)), o: k(lt, a, a + 0.2) });
          });
        },

        gestao(lt, dur) {
          const r = C.gestao;
          $$(".kn", r).forEach((el, i) => {
            const a = 0.8 + i * 0.15;
            const v = Math.round(+el.dataset.n * k(lt, a, a + 0.8));
            el.textContent = v;
            pos(el.parentElement, { y: lerp(20, 0, k(lt, a - 0.1, a + 0.4)), o: k(lt, a - 0.1, a + 0.2) });
          });
          ["b0", "b1"].forEach((c, i) => {
            const el = $("." + c, r);
            el.style.width = (+el.dataset.n / 6) * 100 * k(lt, 1.9 + i * 0.2, 2.8 + i * 0.2, eio) + "%";
          });
          $$(".al", r).forEach((el, i) => pos(el, { x: lerp(30, 0, k(lt, 2.4 + i * 0.15, 2.9 + i * 0.15)), o: k(lt, 2.4 + i * 0.15, 2.7 + i * 0.15) }));
          const alerta = $(".k3", r);
          alerta.style.borderTopColor = lt > 3.2 ? "#f08b81" : "#3a474d";
        },

        fluxo(lt, dur) {
          const r = C.fluxo;
          const linha = $(".linha", r);
          const L_ = linha.getTotalLength();
          const prog = k(lt, 0.9, 3.0, eio);
          linha.style.strokeDasharray = L_;
          linha.style.strokeDashoffset = L_ * (1 - prog);
          $$(".no", r).forEach((no, i) => {
            const a = 0.9 + (i / 6) * 2.1 - 0.1;
            const e = k(lt, a, a + 0.5, eb);
            pos($(".c", no), { s: lerp(0.2, 1, e), o: k(lt, a, a + 0.15) });
            pos($(".r", no), { o: k(lt, a + 0.1, a + 0.4) });
            pos($("img", no), { s: lerp(0.3, 1, k(lt, a + 0.15, a + 0.6, eb)), o: k(lt, a + 0.15, a + 0.3) });
            $(".c", no).style.background = prog * 6 >= i - 0.01 ? "#0b7377" : "#243035";
          });
          const laco = $(".laco", r);
          const pl = k(lt, 3.1, 3.9, eio);
          laco.style.opacity = pl > 0 ? 1 : 0;
          laco.style.strokeDasharray = dashParcial(laco.getTotalLength(), pl);
          pos($(".volta", r), { o: k(lt, 3.7, 4.1) });
        },

        fim(lt, dur) {
          const r = C.fim;
          pos($(".simb", r), { s: lerp(0.5, 1, k(lt, 0.45, 1.1, eb)), o: k(lt, 0.45, 0.7) });
          $$(".nome .w", r).forEach((w, i) => pos(w, { y: lerp(50, 0, k(lt, 0.7 + i * 0.12, 1.3 + i * 0.12, ex)), o: k(lt, 0.7 + i * 0.12, 1.0 + i * 0.12) }));
          pos($(".onde", r), { y: lerp(20, 0, k(lt, 1.2, 1.8)), o: k(lt, 1.2, 1.6) });
          pos($(".ressalva", r), { o: k(lt, 2.0, 2.4) });
        },
      };

      /* tracejado que cresce: repete "10 12" até o comprimento visível e depois um vão */
      function dashParcial(total, p) {
        const vis = total * p, partes = [];
        let usado = 0;
        while (usado + 22 <= vis) { partes.push(10, 12); usado += 22; }
        const resto = vis - usado;
        partes.push(Math.min(10, resto), total + 30);
        return partes.join(" ");
      }

      /* ---------- quadro ---------- */
      function render(t) {
        // fundo
        $$(".fundo svg").forEach((s, i) => {
          const base = [[-120, -120], [L - 300, A * 0.55], [L * 0.45, -260]][i];
          s.style.left = base[0] + "px";
          s.style.top = base[1] + "px";
          s.style.transform = `rotate(${t * (i % 2 ? -4 : 3) + i * 40}deg)`;
        });

        for (const c of CENAS) {
          const el = C[c.id];
          const lt = t - c.ini;
          const viva = lt >= -0.05 && lt <= c.dur + 0.05;
          el.style.display = viva ? "block" : "none";
          if (!viva) continue;
          el.style.opacity = 1;
          if ($(".legenda, .fluxo-legenda", el)) animarLegenda(el, lt, c.dur);
          entradaCaixa(el, lt, c.dur);
          R[c.id](lt, c.dur);
        }

        // trilho das etapas
        const atual = CENAS.find((c) => t >= c.ini && t < c.fim) || CENAS[CENAS.length - 1];
        const trilho = $(".trilho");
        const tIni = CENAS[2].ini, tFim = CENAS[8].fim;
        trilho.style.opacity = Math.min(k(t, tIni + 0.3, tIni + 0.8), 1 - k(t, tFim - 0.5, tFim - 0.1));
        $$(".trilho span").forEach((s, i) => {
          const n = i + 1;
          const e = atual.etapa || 0;
          s.className = n === e || (atual.id === "captacao" && n === 1) ? "agora" : n < e ? "feito" : "";
        });

        // cortinas
        let cobertura = null;
        for (const b of CORTINAS) if (t > b - 0.75 && t < b + 0.75) cobertura = b;
        const cortina = $(".cortina");
        cortina.style.display = cobertura === null ? "none" : "block";
        if (cobertura !== null) {
          for (const c of gradeCortina) {
            const atraso = c.diag * 0.3 + c.sorte * 0.06;
            const a = cobertura - 0.62 + atraso;
            const entra = k(t, a, a + 0.28, eo);
            const b2 = cobertura + 0.04 + atraso;
            const sai = k(t, b2, b2 + 0.3, ei);
            const s = entra * (1 - sai);
            c.svg.style.transform = `scale(${s.toFixed(3)}) rotate(${(1 - entra) * -90 + sai * 90}deg)`;
            c.svg.style.opacity = s > 0.001 ? 1 : 0;
          }
        }
      }

      /* ---------- interface para o gravador ---------- */
      window.VIDEO = { duracao: DURACAO, fps: 30, largura: L, altura: A, render };
      window.PRONTO = (async () => {
        await document.fonts.load('800 40px "Schibsted"');
        await document.fonts.load('400 40px "Schibsted"');
        await document.fonts.ready;
        await Promise.all([...document.images].map((i) => (i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))));
        for (const c of CENAS) C[c.id].style.display = "block";
        medir();
        render(0);
        return true;
      })();

      if (busca.has("tocar")) {
        window.PRONTO.then(() => {
          const t0 = performance.now() - (+busca.get("tocar") || 0) * 1000;
          const laco = () => { render(((performance.now() - t0) / 1000) % DURACAO); requestAnimationFrame(laco); };
          laco();
        });
      }
      if (busca.has("t")) window.PRONTO.then(() => render(+busca.get("t")));
    </script>
  </body>
</html>
